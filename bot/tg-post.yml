name: Telegram автопостинг

on:
  workflow_dispatch:
  # Якщо запускаєте не зовнішнім тригером, а за розкладом, розкоментуйте:
  # schedule:
  #   - cron: '*/10 * * * *'

permissions:
  contents: write            # потрібно, щоб комітити state/kab.json

# не запускати кілька копій одночасно (інакше state/kab.json може дублюватись/конфліктувати)
concurrency:
  group: tg-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-24.04    # замість ubuntu-latest (той перейшов на Ubuntu 26, де apt зависав)
    timeout-minutes: 8
    env:
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      SITE_URL: ${{ secrets.SITE_URL }}
      VERCEL_BYPASS: ${{ secrets.VERCEL_BYPASS }}
      # необов'язкові налаштування (значення за замовчуванням уже в post.mjs):
      # NEWS_SEND: '0'
      # NEWS_MAX_AGE_MIN: '20'
      # KAB_COOLDOWN_MIN: '60'
      # WAIT_MS: '25000'
      # HOOKS_TIMEOUT_MS: '60000'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm deps
        run: npm install --prefix bot --no-audit --no-fund

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-1.63.0-chromium

      - name: Apt retry settings
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' | sudo tee /etc/apt/apt.conf.d/99retries

      - name: Install Chromium + system deps
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 4
        run: |
          sudo apt-get update
          npx --prefix bot playwright install --with-deps chromium

      - name: Install system deps only (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        timeout-minutes: 3
        run: |
          sudo apt-get update
          npx --prefix bot playwright install-deps chromium

      - name: Post to Telegram
        run: node bot/post.mjs

      - name: Commit state
        if: always()
        run: |
          if [ -n "$(git status --porcelain state/)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "state: update kab.json"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push || echo "::warning::push state не вдався"
          fi
