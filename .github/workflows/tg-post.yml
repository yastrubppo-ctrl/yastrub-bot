name: Telegram автопостинг
on:
  workflow_dispatch:           # запускає cron-job.org кожні 5 хв (+ ручна кнопка Run workflow)
concurrency: tg-post
permissions:
  contents: write              # щоб зберігати пам'ять про надіслані КАБ-попередження
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --prefix bot
      - run: npx --prefix bot playwright install --with-deps chromium
      - run: node bot/post.mjs
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SITE_URL: ${{ secrets.SITE_URL }}
          VERCEL_BYPASS: ${{ secrets.VERCEL_BYPASS }}
      - name: Зберегти пам'ять (лише якщо змінилась)
        run: |
          if [ -f state/kab.json ]; then
            git config user.name "yastrub-bot"
            git config user.email "bot@users.noreply.github.com"
            git add state/kab.json
            git diff --cached --quiet || (git commit -m "state" && git push)
          fi
