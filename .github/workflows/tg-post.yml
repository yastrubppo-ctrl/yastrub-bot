name: Telegram автопостинг
on:
  workflow_dispatch:
concurrency: tg-post
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --prefix bot
      - run: npx --prefix bot playwright install --with-deps chromium
      - uses: actions/cache@v4
        with:
          path: bot/alert-state.json
          key: alert-state-${{ github.run_id }}
          restore-keys: alert-state-
      - run: node bot/post.mjs
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SITE_URL: ${{ secrets.SITE_URL }}
          VERCEL_BYPASS: ${{ secrets.VERCEL_BYPASS }}
