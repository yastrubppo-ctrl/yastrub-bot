# .github/workflows/bot.yml
# ОДИН бот, що працює майже безперервно: один запуск живе ~5 год 40 хв і сам вирішує, що і коли слати
# (балістика ≤1 хв, пуски БпЛА і ракети раз на 5 хв, загальна ситуація раз на 10 хв).
# cron раз на 5 хв — лише «сторожовий пес»: якщо запуск упав або завершився, наступний підхопить за кілька хвилин.
# Підлаштуйте: шлях до post.mjs (тут scripts/post.mjs), крок встановлення playwright, імена secrets.
name: yastrub-bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# не скасовуємо запуск, що працює; один новий чекає в черзі (старіші очікуючі замінюються)
concurrency:
  group: yastrub-bot
  cancel-in-progress: false

permissions:
  contents: write        # щоб комітити state/kab.json

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # ліміт GitHub — 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i playwright --no-save && npx playwright install --with-deps chromium
      - name: Бот
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SITE_URL: ${{ secrets.SITE_URL }}
          VERCEL_BYPASS: ${{ secrets.VERCEL_BYPASS }}
          RUN_SEC: '20400'          # 5 год 40 хв безперервної роботи
          POLL_SEC: '10'            # перевірка стрічки кожні 10 с
          BALLISTIC_MIN: '1'
          LAUNCH_MIN: '5'
          MISSILE_MIN: '5'
          SITUATION_MIN: '10'
        run: node scripts/post.mjs
      - name: Зберегти стан (щоб наступний запуск не дублював повідомлення)
        if: always()
        run: |
          git config user.name  "yastrub-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/kab.json || true
          git diff --cached --quiet || (git commit -m "state" && git pull --rebase && git push)
